<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Progression changes the operating model</title>
<desc id="desc">Higher levels widen ownership and create results through increasing organizational leverage.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8.85" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.85" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
  </style>
</defs>

<rect width="1200" height="850" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="814" fill="none" stroke="#111111" stroke-width="2"/>
<text x="58" y="62" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">CAREER PROGRESSION</tspan></text>
<text x="58" y="104" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Progression changes the operating model</tspan></text>
<text x="58" y="134" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Higher levels widen ownership and create results through increasing organizational leverage.</tspan></text>
<line x1="58" y1="154" x2="1142" y2="154" stroke="#111111" stroke-width="2"/>
<rect x="58" y="202" width="320" height="508" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="58" y="202" width="320" height="66" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="76" y="229" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="start" letter-spacing="1.0"><tspan x="76" dy="0">EARLIER LEVELS</tspan></text>
<text x="360" y="249" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="end" letter-spacing="0"><tspan x="360" dy="0">IC1–IC3</tspan></text>
<text x="76" y="300" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="76" dy="0">UNIT OF OWNERSHIP</tspan></text>
<text x="76" y="331" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Task, procedure,</tspan><tspan x="76" dy="22">or component</tspan></text>
<line x1="76" y1="384" x2="360" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="76" y="410" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="76" dy="0">PROBLEM DEFINITION</tspan></text>
<text x="76" y="441" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Receives the task;</tspan><tspan x="76" dy="22">follows a known path</tspan></text>
<line x1="76" y1="494" x2="360" y2="494" stroke="#ddd5bf" stroke-width="2"/>
<text x="76" y="520" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="76" dy="0">RESULTS THROUGH</tspan></text>
<text x="76" y="551" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Direct execution</tspan></text>
<line x1="76" y1="604" x2="360" y2="604" stroke="#ddd5bf" stroke-width="2"/>
<text x="76" y="630" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="76" dy="0">TYPICAL HORIZON</tspan></text>
<text x="76" y="661" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Local system</tspan><tspan x="76" dy="22">Hours to weeks</tspan></text>
<rect x="410" y="202" width="320" height="508" fill="#fffdf5" stroke="#dcc61e" stroke-width="3"/>
<rect x="410" y="202" width="320" height="66" fill="#dcc61e" stroke="#dcc61e" stroke-width="2"/>
<text x="428" y="229" font-size="13" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="1.0"><tspan x="428" dy="0">SENIOR LEVELS</tspan></text>
<text x="712" y="249" font-size="15" font-weight="800" fill="#111111" text-anchor="end" letter-spacing="0"><tspan x="712" dy="0">IC4–IC5</tspan></text>
<text x="428" y="300" font-size="12" font-weight="800" fill="#dcc61e" text-anchor="start" letter-spacing="1.1"><tspan x="428" dy="0">UNIT OF OWNERSHIP</tspan></text>
<text x="428" y="331" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="428" dy="0">Project, service outcome,</tspan><tspan x="428" dy="22">or team roadmap</tspan></text>
<line x1="428" y1="384" x2="712" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="428" y="410" font-size="12" font-weight="800" fill="#dcc61e" text-anchor="start" letter-spacing="1.1"><tspan x="428" dy="0">PROBLEM DEFINITION</tspan></text>
<text x="428" y="441" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="428" dy="0">Chooses the approach;</tspan><tspan x="428" dy="22">defines the delivery plan</tspan></text>
<line x1="428" y1="494" x2="712" y2="494" stroke="#ddd5bf" stroke-width="2"/>
<text x="428" y="520" font-size="12" font-weight="800" fill="#dcc61e" text-anchor="start" letter-spacing="1.1"><tspan x="428" dy="0">RESULTS THROUGH</tspan></text>
<text x="428" y="551" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="428" dy="0">Leads projects and</tspan><tspan x="428" dy="22">coordinates contributors</tspan></text>
<line x1="428" y1="604" x2="712" y2="604" stroke="#ddd5bf" stroke-width="2"/>
<text x="428" y="630" font-size="12" font-weight="800" fill="#dcc61e" text-anchor="start" letter-spacing="1.1"><tspan x="428" dy="0">TYPICAL HORIZON</tspan></text>
<text x="428" y="661" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="428" dy="0">Team or domain</tspan><tspan x="428" dy="22">Weeks to quarters</tspan></text>
<rect x="762" y="202" width="320" height="508" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="762" y="202" width="320" height="66" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="780" y="229" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="start" letter-spacing="1.0"><tspan x="780" dy="0">STAFF+ LEVELS</tspan></text>
<text x="1064" y="249" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="end" letter-spacing="0"><tspan x="1064" dy="0">IC6–IC9</tspan></text>
<text x="780" y="300" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="780" dy="0">UNIT OF OWNERSHIP</tspan></text>
<text x="780" y="331" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="780" dy="0">Cross-team capability,</tspan><tspan x="780" dy="22">portfolio, or direction</tspan></text>
<line x1="780" y1="384" x2="1064" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="780" y="410" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="780" dy="0">PROBLEM DEFINITION</tspan></text>
<text x="780" y="441" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="780" dy="0">Identifies the problem;</tspan><tspan x="780" dy="22">creates the workstream</tspan></text>
<line x1="780" y1="494" x2="1064" y2="494" stroke="#ddd5bf" stroke-width="2"/>
<text x="780" y="520" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="780" dy="0">RESULTS THROUGH</tspan></text>
<text x="780" y="551" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="780" dy="0">Influence, standards,</tspan><tspan x="780" dy="22">delegation, other leaders</tspan></text>
<line x1="780" y1="604" x2="1064" y2="604" stroke="#ddd5bf" stroke-width="2"/>
<text x="780" y="630" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="780" dy="0">TYPICAL HORIZON</tspan></text>
<text x="780" y="661" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="780" dy="0">Cross-team to enterprise</tspan><tspan x="780" dy="22">Multiple quarters to years</tspan></text>
<line x1="378" y1="456" x2="400" y2="456" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="730" y1="456" x2="752" y2="456" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<text x="600" y="750" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="600" dy="0">THE SHIFT</tspan></text>
<text x="600" y="779" font-size="18" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="600" dy="0">Assigned work  →  owned outcomes  →  created organizational scope</tspan></text>
<line x1="58" y1="786" x2="1142" y2="786" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="813" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Progression is a change in ownership and leverage, not simply an increase in technical difficulty.</tspan></text>
</svg>
