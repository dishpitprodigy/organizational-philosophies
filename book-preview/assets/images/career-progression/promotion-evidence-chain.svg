<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">A promotion case must show causation</title>
<desc id="desc">A reader should be able to trace the contribution from the original problem to a result that persists.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8.85" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.85" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
  </style>
</defs>

<rect width="1200" height="790" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="754" fill="none" stroke="#111111" stroke-width="2"/>
<text x="58" y="62" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">CAREER PROGRESSION</tspan></text>
<text x="58" y="104" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">A promotion case must show causation</tspan></text>
<text x="58" y="134" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">A reader should be able to trace the contribution from the original problem to a result that persists.</tspan></text>
<line x1="58" y1="154" x2="1142" y2="154" stroke="#111111" stroke-width="2"/>
<rect x="58" y="220" width="184" height="262" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="58" y="220" width="44" height="36" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="80" y="244" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="80" dy="0">01</tspan></text>
<text x="74" y="295" font-size="18" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">Problem</tspan></text>
<text x="74" y="333" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">What needed</tspan><tspan x="74" dy="21">to change?</tspan></text>
<line x1="74" y1="384" x2="226" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="74" y="411" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="74" dy="0">EVIDENCE</tspan></text>
<text x="74" y="439" font-size="13" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="74" dy="0">Baseline</tspan><tspan x="74" dy="19">Consequence</tspan></text>
<rect x="276" y="220" width="184" height="262" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="276" y="220" width="44" height="36" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="298" y="244" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="298" dy="0">02</tspan></text>
<text x="292" y="295" font-size="18" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="292" dy="0">Ownership</tspan></text>
<text x="292" y="333" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="292" dy="0">What did the</tspan><tspan x="292" dy="21">person own?</tspan></text>
<line x1="292" y1="384" x2="444" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="292" y="411" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="292" dy="0">EVIDENCE</tspan></text>
<text x="292" y="439" font-size="13" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="292" dy="0">Objective</tspan><tspan x="292" dy="19">Scope • authority</tspan></text>
<rect x="494" y="220" width="184" height="262" fill="#fffdf5" stroke="#dcc61e" stroke-width="3"/>
<rect x="494" y="220" width="44" height="36" fill="#dcc61e" stroke="#dcc61e" stroke-width="2"/>
<text x="516" y="244" font-size="13" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="516" dy="0">03</tspan></text>
<text x="510" y="295" font-size="18" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="510" dy="0">Decisions</tspan></text>
<text x="510" y="333" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="510" dy="0">What judgment</tspan><tspan x="510" dy="21">did they add?</tspan></text>
<line x1="510" y1="384" x2="662" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="510" y="411" font-size="12" font-weight="800" fill="#dcc61e" text-anchor="start" letter-spacing="1.1"><tspan x="510" dy="0">EVIDENCE</tspan></text>
<text x="510" y="439" font-size="13" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="510" dy="0">Tradeoffs</tspan><tspan x="510" dy="19">Direction</tspan></text>
<rect x="712" y="220" width="184" height="262" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="712" y="220" width="44" height="36" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="734" y="244" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="734" dy="0">04</tspan></text>
<text x="728" y="295" font-size="18" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="728" dy="0">Adoption</tspan></text>
<text x="728" y="333" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="728" dy="0">Who changed</tspan><tspan x="728" dy="21">behavior?</tspan></text>
<line x1="728" y1="384" x2="880" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="728" y="411" font-size="12" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.1"><tspan x="728" dy="0">EVIDENCE</tspan></text>
<text x="728" y="439" font-size="13" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="728" dy="0">Teams • leaders</tspan><tspan x="728" dy="19">Systems</tspan></text>
<rect x="930" y="220" width="184" height="262" fill="#fffdf5" stroke="#2f7d32" stroke-width="3"/>
<rect x="930" y="220" width="44" height="36" fill="#2f7d32" stroke="#2f7d32" stroke-width="2"/>
<text x="952" y="244" font-size="13" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="952" dy="0">05</tspan></text>
<text x="946" y="295" font-size="18" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="946" dy="0">Durable outcome</tspan></text>
<text x="946" y="333" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="946" dy="0">What continued</tspan><tspan x="946" dy="21">afterward?</tspan></text>
<line x1="946" y1="384" x2="1098" y2="384" stroke="#ddd5bf" stroke-width="2"/>
<text x="946" y="411" font-size="12" font-weight="800" fill="#2f7d32" text-anchor="start" letter-spacing="1.1"><tspan x="946" dy="0">EVIDENCE</tspan></text>
<text x="946" y="439" font-size="13" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="946" dy="0">Measured change</tspan><tspan x="946" dy="19">Owner • mechanism</tspan></text>
<line x1="242" y1="351" x2="266" y2="351" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="460" y1="351" x2="484" y2="351" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="678" y1="351" x2="702" y2="351" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="896" y1="351" x2="920" y2="351" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<text x="58" y="535" font-size="12" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="58" dy="0">EVIDENCE FOUNDATION</tspan></text>
<rect x="58" y="554" width="330" height="92" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="76" y="585" font-size="16" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Artifacts</tspan></text>
<text x="76" y="617" font-size="14" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Charters • designs • decisions</tspan></text>
<rect x="420" y="554" width="330" height="92" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="438" y="585" font-size="16" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="438" dy="0">Measures</tspan></text>
<text x="438" y="617" font-size="14" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="438" dy="0">Before/after • risk • capacity</tspan></text>
<rect x="782" y="554" width="330" height="92" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="800" y="585" font-size="16" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="800" dy="0">Attribution</tspan></text>
<text x="800" y="617" font-size="14" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="800" dy="0">Stakeholders • adoption • ownership</tspan></text>
<rect x="305" y="679" width="590" height="48" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="600" y="709" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="1.2"><tspan x="600" dy="0">ACTIVITY IS NOT IMPACT</tspan></text>
<line x1="58" y1="726" x2="1142" y2="726" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="753" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Attendance, effort, relationships, and output volume cannot substitute for a traceable outcome.</tspan></text>
</svg>
