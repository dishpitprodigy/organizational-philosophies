<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A seminar turns serious ideas into better questions</title>
<desc id="desc">A three-stage session moves from credible material through collective inquiry to an open question, while the facilitator protects curiosity rather than forcing agreement or action.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
  </style>
</defs>

<rect width="1200" height="760" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="724" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="700" fill="none" stroke="#111111" stroke-width="1"/>

<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" letter-spacing="1.8">SOCRATIC LEADERSHIP / SEMINAR FIGURE</text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111">A seminar turns serious ideas into better questions</text>
<text x="58" y="132" font-size="17" fill="#5f5a4e">The room is designed for inquiry: encounter a claim, test it together, and leave some tension alive.</text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>

<rect x="60" y="230" width="280" height="155" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="60" y="230" width="44" height="37" fill="#ad0034"/>
<text x="82" y="255" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">1</text>
<text x="118" y="258" class="box-title" fill="#111111">ENCOUNTER</text>
<text x="78" y="298" class="box-copy">
  <tspan x="78" dy="0">Credible material</tspan>
  <tspan x="78" dy="24">Claims, evidence, methods</tspan>
  <tspan x="78" dy="24">A genuine provocation</tspan>
</text>

<line x1="340" y1="307" x2="455" y2="307" stroke="#ad0034" stroke-width="4" marker-end="url(#arrow-ink)"/>

<rect x="460" y="230" width="280" height="155" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="460" y="230" width="44" height="37" fill="#007f7b"/>
<text x="482" y="255" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">2</text>
<text x="518" y="258" class="box-title" fill="#111111">EXPLORE</text>
<text x="478" y="298" class="box-copy">
  <tspan x="478" dy="0">Competing interpretations</tspan>
  <tspan x="478" dy="24">Lived experience</tspan>
  <tspan x="478" dy="24">Disagreement that can breathe</tspan>
</text>

<line x1="740" y1="307" x2="855" y2="307" stroke="#007f7b" stroke-width="4" marker-end="url(#arrow-cyan)"/>

<rect x="860" y="230" width="280" height="155" fill="#fff8e0" stroke="#2f7d32" stroke-width="3"/>
<rect x="860" y="230" width="44" height="37" fill="#2f7d32"/>
<text x="882" y="255" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">3</text>
<text x="918" y="258" class="box-title" fill="#111111">LEAVE OPEN</text>
<text x="878" y="298" class="box-copy">
  <tspan x="878" dy="0">A better question</tspan>
  <tspan x="878" dy="24">A productive disagreement</tspan>
  <tspan x="878" dy="24">An idea that returns later</tspan>
</text>

<rect x="60" y="455" width="700" height="150" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="78" y="488" font-size="15" font-weight="800" fill="#007f7b" letter-spacing="1.4">FACILITATOR DISCIPLINE</text>
<text x="78" y="526" class="box-copy">
  <tspan x="78" dy="0">Notice connections  •  surface tensions  •  invite experience</tspan>
  <tspan x="78" dy="27">return to the research  •  protect the purpose of the room</tspan>
</text>
<text x="78" y="583" class="small">The facilitator is a co-explorer, not the owner of a predetermined conclusion.</text>

<rect x="800" y="455" width="340" height="150" fill="#fff8e0" stroke="#ad0034" stroke-width="3"/>
<text x="818" y="488" font-size="15" font-weight="800" fill="#ad0034" letter-spacing="1.4">NOT THE OUTPUT</text>
<text x="818" y="526" class="box-copy">
  <tspan x="818" dy="0">Forced agreement</tspan>
  <tspan x="818" dy="24">A prescribed lesson</tspan>
  <tspan x="818" dy="24">An action plan</tspan>
</text>

<line x1="58" y1="694" x2="1142" y2="694" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="722" font-size="14" font-weight="600" fill="#5f5a4e">The fixing, if it happens, is a byproduct of repeated encounters between research and experience.</text>
</svg>
