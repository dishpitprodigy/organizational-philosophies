<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">The forecast moves; the approved baseline does not</title>
<desc id="desc">Learning changes what the organization expects, while the original commitment remains available for comparison.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fffdf5"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="2" opacity=".22"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f5efdc"/>
    <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-width="1" opacity=".08"/>
  </pattern>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
    .tiny { font-size: 12px; fill: #5f5a4e; letter-spacing: .5px; }
  </style>
</defs>

<rect width="1200" height="740" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="704" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="680" fill="none" stroke="none"/>
<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">WORK INTAKE / SYSTEM FIGURE</tspan></text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The forecast moves; the approved baseline does not</tspan></text>
<text x="58" y="132" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Learning changes what the organization expects, while the original commitment remains available for comparison.</tspan></text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>
<line x1="110" y1="600" x2="1110" y2="600" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="160" y1="590" x2="160" y2="612" stroke="#111111" stroke-width="3"/>
<text x="160" y="636" font-size="12" font-weight="800" fill="#5f5a4e" text-anchor="middle" letter-spacing="0.8"><tspan x="160" dy="0">AUTHORIZATION</tspan></text>
<line x1="430" y1="590" x2="430" y2="612" stroke="#111111" stroke-width="3"/>
<text x="430" y="636" font-size="12" font-weight="800" fill="#5f5a4e" text-anchor="middle" letter-spacing="0.8"><tspan x="430" dy="0">DELIVERY</tspan></text>
<line x1="700" y1="590" x2="700" y2="612" stroke="#111111" stroke-width="3"/>
<text x="700" y="636" font-size="12" font-weight="800" fill="#5f5a4e" text-anchor="middle" letter-spacing="0.8"><tspan x="700" dy="0">MORE EVIDENCE</tspan></text>
<line x1="1010" y1="590" x2="1010" y2="612" stroke="#111111" stroke-width="3"/>
<text x="1010" y="636" font-size="12" font-weight="800" fill="#5f5a4e" text-anchor="middle" letter-spacing="0.8"><tspan x="1010" dy="0">COMPLETION</tspan></text>
<path d="M160,265 L1010,265" fill="none" stroke="#ad0034" stroke-width="4"/>
<circle cx="160" cy="265" r="11" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="185" y="236" font-size="17" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="0"><tspan x="185" dy="0">APPROVED DELIVERY BASELINE</tspan></text>
<text x="185" y="282" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="185" dy="0">Fixed record of the estimate used to commit capacity</tspan></text>
<path d="M160,475 L430,440 L700,365 L1010,405" fill="none" stroke="#007f7b" stroke-width="5" marker-end="url(#arrow-cyan)"/>
<circle cx="160" cy="475" r="10" fill="#fffdf5" stroke="#007f7b" stroke-width="4"/>
<text x="160" y="451" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="160" dy="0">F1</tspan></text>
<circle cx="430" cy="440" r="10" fill="#fffdf5" stroke="#007f7b" stroke-width="4"/>
<text x="430" y="416" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="430" dy="0">F2</tspan></text>
<circle cx="700" cy="365" r="10" fill="#fffdf5" stroke="#007f7b" stroke-width="4"/>
<text x="700" y="341" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="700" dy="0">F3</tspan></text>
<circle cx="1010" cy="405" r="10" fill="#fffdf5" stroke="#007f7b" stroke-width="4"/>
<text x="1010" y="381" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="1010" dy="0">F4</tspan></text>
<text x="185" y="515" font-size="17" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="0"><tspan x="185" dy="0">DELIVERY FORECAST</tspan></text>
<text x="185" y="544" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="185" dy="0">Updated as implementation exposes new evidence</tspan></text>
<path d="M700,365 L700,190 L920,190" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-ink)"/>
<rect x="920" y="165" width="220" height="90" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3" stroke-dasharray="9 7"/>
<text x="936" y="193" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="936" dy="0">NEW AUTHORITY</tspan></text>
<text x="936" y="220" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="936" dy="0">Required only if outcome,</tspan><tspan x="936" dy="20">scope, or boundary changes</tspan></text>
<line x1="58" y1="674" x2="1142" y2="674" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="702" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Keeping both records supports honest planning without rewriting whether the original assumptions were any good.</tspan></text>
</svg>
