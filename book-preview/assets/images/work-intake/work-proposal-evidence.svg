<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A Work Proposal proves a change is worth evaluating</title>
<desc id="desc">The core argument runs from the present condition to an observable outcome; the surrounding evidence makes it governable.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fffdf5"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="2" opacity=".22"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f5efdc"/>
    <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-width="1" opacity=".08"/>
  </pattern>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
    .tiny { font-size: 12px; fill: #5f5a4e; letter-spacing: .5px; }
  </style>
</defs>

<rect width="1200" height="720" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="684" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="660" fill="none" stroke="none"/>
<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">WORK INTAKE / SYSTEM FIGURE</tspan></text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">A Work Proposal proves a change is worth evaluating</tspan></text>
<text x="58" y="132" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The core argument runs from the present condition to an observable outcome; the surrounding evidence makes it governable.</tspan></text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>
<rect x="60" y="230" width="250" height="120" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<rect x="60" y="230" width="42" height="35" rx="0" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="81" y="254" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="81" dy="0">1</tspan></text>
<text x="114" y="258" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="114" dy="0">CURRENT STATE</tspan></text>
<text x="76" y="285" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Condition, failure,</tspan><tspan x="76" dy="20">constraint, or cost</tspan></text>
<rect x="475" y="230" width="250" height="120" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="475" y="230" width="42" height="35" rx="0" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="496" y="254" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="496" dy="0">2</tspan></text>
<text x="529" y="258" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="529" dy="0">REQUIRED DIFFERENCE</tspan></text>
<text x="491" y="285" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="491" dy="0">The material gap</tspan><tspan x="491" dy="20">the work must close</tspan></text>
<rect x="890" y="230" width="250" height="120" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="890" y="230" width="42" height="35" rx="0" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="911" y="254" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="911" dy="0">3</tspan></text>
<text x="944" y="258" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="944" dy="0">DESIRED OUTCOME</tspan></text>
<text x="906" y="285" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="906" dy="0">What becomes true</tspan><tspan x="906" dy="20">and how we will know</tspan></text>
<line x1="310" y1="290" x2="475" y2="290" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="725" y1="290" x2="890" y2="290" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="60" y="430" width="255" height="115" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<text x="76" y="458" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">BOUNDARIES</tspan></text>
<text x="76" y="485" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Requirements</tspan><tspan x="76" dy="20">Non-goals</tspan></text>
<rect x="335" y="430" width="255" height="115" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="351" y="458" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="351" dy="0">PROOF</tspan></text>
<text x="351" y="485" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="351" dy="0">Acceptance conditions</tspan><tspan x="351" dy="20">Timing evidence</tspan></text>
<rect x="610" y="430" width="255" height="115" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<text x="626" y="458" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="626" dy="0">FEASIBILITY</tspan></text>
<text x="626" y="485" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="626" dy="0">Dependencies</tspan><tspan x="626" dy="20">Known uncertainty</tspan></text>
<rect x="885" y="430" width="255" height="115" rx="0" fill="#fffdf5" stroke="#dcc61e" stroke-width="3"/>
<text x="901" y="458" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="901" dy="0">STEWARDSHIP</tspan></text>
<text x="901" y="485" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="901" dy="0">Operational owner</tspan><tspan x="901" dy="20">Sponsor</tspan></text>
<path d="M188,430 L188,390 L600,390 L600,350" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-ink)"/>
<path d="M462,430 L462,390" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M738,430 L738,390" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7"/>
<path d="M1012,430 L1012,390 L600,390" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="58" y1="654" x2="1142" y2="654" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="682" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The proposal governs one top-level outcome; effort changes decomposition, not the completion condition.</tspan></text>
</svg>
