<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Small deviations widen downstream</title>
<desc id="desc">The visible miss may occur far from the decision that created it.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fffdf5"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="2" opacity=".22"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f5efdc"/>
    <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-width="1" opacity=".08"/>
  </pattern>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
    .tiny { font-size: 12px; fill: #5f5a4e; letter-spacing: .5px; }
  </style>
</defs>

<rect width="1200" height="720" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="684" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="660" fill="none" stroke="none"/>
<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">WORK INTAKE / SYSTEM FIGURE</tspan></text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Small deviations widen downstream</tspan></text>
<text x="58" y="132" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The visible miss may occur far from the decision that created it.</tspan></text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>
<path d="M150 560 Q600 250 1110 205 L1110 600 Q600 575 150 560 Z" fill="#fff8e0" stroke="#111111" stroke-width="2"/>
<path d="M160,555 L1110,400" fill="none" stroke="#007f7b" stroke-width="4" marker-end="url(#arrow-cyan)"/>
<path d="M160,555 L1110,220" fill="none" stroke="#ad0034" stroke-width="4" marker-end="url(#arrow-red)"/>
<path d="M160,555 L1110,585" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="10 9"/>
<line x1="137" y1="505" x2="168" y2="607" stroke="#111111" stroke-width="10"/>
<line x1="145" y1="510" x2="185" y2="600" stroke="#ad0034" stroke-width="4"/>
<circle cx="160" cy="555" r="9" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<path d="M214,536 L235,508 L250,534" fill="none" stroke="#ad0034" stroke-width="2"/>
<text x="260" y="515" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="0"><tspan x="260" dy="0">MILLIMETERS</tspan><tspan x="260" dy="19">AT CONTACT</tspan></text>
<text x="938" y="188" font-size="16" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="0"><tspan x="938" dy="0">OFF INTO THE WOODS</tspan></text>
<text x="920" y="382" font-size="16" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="0"><tspan x="920" dy="0">DOWN THE FAIRWAY</tspan></text>
<text x="905" y="625" font-size="14" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="905" dy="0">UNQUESTIONED ASSUMPTION</tspan></text>
<line x1="680" y1="324" x2="680" y2="461" stroke="#111111" stroke-width="2"/>
<line x1="664" y1="324" x2="696" y2="324" stroke="#111111" stroke-width="2"/>
<line x1="664" y1="461" x2="696" y2="461" stroke="#111111" stroke-width="2"/>
<text x="705" y="383" font-size="16" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="705" dy="0">THE GAP GROWS</tspan><tspan x="705" dy="21">WITH EVERY HANDOFF</tspan></text>
<line x1="58" y1="654" x2="1142" y2="654" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="682" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Early review does not prevent every miss; it keeps known questions from becoming avoidable downstream failures.</tspan></text>
</svg>
