<rect x="930" y="495" width="210" height="105" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="946" y="523" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="946" dy="0">DELIVERY TEAMS</tspan></text>
