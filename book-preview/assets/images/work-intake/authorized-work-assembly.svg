<text x="76" y="405" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">Cost model</tspan><tspan x="76" dy="20">Funding condition</tspan></text>
<rect x="60" y="495" width="210" height="105" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
