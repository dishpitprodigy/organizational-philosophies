<text x="946" y="260" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="946" dy="0">Applicable duties</tspan><tspan x="946" dy="20">Required conditions</tspan></text>
