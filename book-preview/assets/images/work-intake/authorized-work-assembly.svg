<text x="470" y="452" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">Review decisions + provenance</tspan></text>
<line x1="435" y1="484" x2="455" y2="484" stroke="#007f7b" stroke-width="5"/>
<text x="470" y="490" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">Dependencies + capacity evidence</tspan></text>
<line x1="435" y1="522" x2="455" y2="522" stroke="#007f7b" stroke-width="5"/>
<text x="470" y="528" font-size="16" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">Owners + dates + version history</tspan></text>
<path d="M270,257 L365,257" fill="none" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M270,402 L365,402" fill="none" stroke="#dcc61e" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M270,547 L365,547" fill="none" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M930,257 L835,257" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M930,402 L835,402" fill="none" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M930,547 L835,547" fill="none" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-ink)"/>
<text x="600" y="645" font-size="16" font-weight="800" fill="#ad0034" text-anchor="middle" letter-spacing="1.2"><tspan x="600" dy="0">SPECIALIST RECORDS REMAIN INTACT</tspan></text>
<text x="600" y="674" font-size="15" font-weight="500" fill="#5f5a4e" text-anchor="middle" letter-spacing="0"><tspan x="600" dy="0">The common envelope proves whose decision applies to which proposal revision.</tspan></text>
<line x1="58" y1="734" x2="1142" y2="734" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="762" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Delivery records may refine execution; changing authority requires a superseding proposal revision.</tspan></text>
</svg>
