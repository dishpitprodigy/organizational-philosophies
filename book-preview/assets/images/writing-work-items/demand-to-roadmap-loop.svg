<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Demand evidence earns roadmap investment</title>
<desc id="desc">Incidents and requests capture work type, cause, and time. Causes are ranked until a threshold triggers a roadmap epic, whose outcome is measured back against the same demand data.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 18px; font-weight: 800; }
    .copy { font-size: 15px; fill: #5f5a4e; }
    .small { font-size: 12px; font-weight: 800; letter-spacing: .7px; }
  </style>
</defs>

<rect width="1200" height="820" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="784" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="760" fill="none" stroke="#111111" stroke-width="1"/>

<text x="58" y="60" class="eyebrow" fill="#ad0034">WRITING WORK ITEMS / SYSTEM FIGURE</text>
<text x="58" y="102" class="title" fill="#111111">Demand evidence earns roadmap investment</text>
<text x="58" y="132" class="subtitle">The loop crosses reporting boundaries, then tests the improvement against the demand source that justified it.</text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>

<rect x="55" y="235" width="190" height="150" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="55" y="235" width="44" height="36" fill="#ad0034"/>
<text x="77" y="260" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="middle">1</text>
<text x="113" y="262" class="small" fill="#ad0034">DEMAND QUEUE</text>
<text x="75" y="305" class="box-title" fill="#111111">Incidents</text>
<text x="75" y="333" class="box-title" fill="#111111">Requests</text>
<text x="75" y="365" class="copy">Work that arrives</text>

<line x1="245" y1="310" x2="280" y2="310" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="280" y="235" width="210" height="150" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="280" y="235" width="44" height="36" fill="#007f7b"/>
<text x="302" y="260" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="middle">2</text>
<text x="338" y="262" class="small" fill="#007f7b">CAPTURE</text>
<text x="300" y="305" class="box-title" fill="#111111">Work type</text>
<text x="300" y="332" class="box-title" fill="#111111">Resolve-gated cause</text>
<text x="300" y="359" class="box-title" fill="#111111">Worklog time</text>

<line x1="490" y1="310" x2="525" y2="310" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="525" y="235" width="200" height="150" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<rect x="525" y="235" width="44" height="36" fill="#111111"/>
<text x="547" y="260" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="middle">3</text>
<text x="583" y="262" class="small" fill="#111111">RANK CAUSES</text>
<text x="545" y="309" font-size="26" font-weight="800" fill="#111111">count × hours</text>
<text x="545" y="341" class="copy">Rolling window exposes</text>
<text x="545" y="363" class="copy">recurring toil</text>

<line x1="725" y1="310" x2="760" y2="310" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>

<polygon points="835,230 910,310 835,390 760,310" fill="#fff8e0" stroke="#dcc61e" stroke-width="3"/>
<text x="835" y="292" class="small" fill="#111111" text-anchor="middle">THRESHOLD</text>
<text x="835" y="320" class="box-title" fill="#111111" text-anchor="middle">crossed?</text>
<text x="835" y="344" class="copy" text-anchor="middle">N or X hours</text>

<line x1="910" y1="310" x2="945" y2="310" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<text x="928" y="291" class="small" fill="#2f7d32" text-anchor="middle">YES</text>

<rect x="945" y="235" width="200" height="150" fill="#fffdf5" stroke="#2f7d32" stroke-width="3"/>
<rect x="945" y="235" width="44" height="36" fill="#2f7d32"/>
<text x="967" y="260" font-size="15" font-weight="800" fill="#fffdf5" text-anchor="middle">4</text>
<text x="1003" y="262" class="small" fill="#2f7d32">ROADMAP EPIC</text>
<text x="965" y="305" class="box-title" fill="#111111">Retire the driver</text>
<text x="965" y="334" class="copy">Outcome names the</text>
<text x="965" y="355" class="copy">demand source to reduce</text>

<path d="M835,390 L835,436 L625,436 L625,470" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-ink)"/>
<rect x="505" y="480" width="240" height="48" fill="#fffdf5" stroke="#111111" stroke-width="2" stroke-dasharray="8 7"/>
<text x="625" y="510" class="small" fill="#5f5a4e" text-anchor="middle">BELOW → KEEP MEASURING</text>

<path d="M1045,385 L1045,500" fill="none" stroke="#2f7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
<rect x="720" y="515" width="425" height="120" fill="#fffdf5" stroke="#2f7d32" stroke-width="3"/>
<rect x="720" y="515" width="52" height="38" fill="#2f7d32"/>
<text x="746" y="541" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">5</text>
<text x="788" y="544" class="small" fill="#2f7d32">MEASURE THE OUTCOME IN DEMAND DATA</text>
<text x="744" y="584" class="box-title" fill="#111111">Did the cause volume actually shrink?</text>
<text x="744" y="608" class="copy">Use the same category, count, hours, and window</text>
<text x="744" y="629" class="copy">that justified the epic.</text>

<path d="M720,575 L655,575 L655,675 L150,675 L150,385" fill="none" stroke="#2f7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
<rect x="267" y="657" width="285" height="36" fill="#fff8e0" stroke="#2f7d32" stroke-width="2"/>
<text x="409" y="680" class="small" fill="#2f7d32" text-anchor="middle">EVIDENCE RETURNS TO THE SOURCE</text>

<text x="60" y="455" class="small" fill="#ad0034">DEMAND REPORTING</text>
<line x1="60" y1="466" x2="490" y2="466" stroke="#ad0034" stroke-width="2"/>
<text x="945" y="455" class="small" fill="#2f7d32">ROADMAP REPORTING</text>
<line x1="945" y1="466" x2="1145" y2="466" stroke="#2f7d32" stroke-width="2"/>

<line x1="58" y1="747" x2="1142" y2="747" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="776" font-size="14" font-weight="600" fill="#5f5a4e">Incidents remain demand evidence; the improvement epic is separate work with a measurable exit condition.</text>
</svg>
