<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">An RFP makes the risk boundary explicit</title>
<desc id="desc">Buyer responsibilities remain on the left. The RFP converts operating needs into requirements, tests, and remedies in the center. Vendor obligations that can be verified and enforced appear on the right. Undefined expectations fall back to the buyer.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 19px; font-weight: 800; }
    .copy { font-size: 15px; fill: #5f5a4e; }
    .small { font-size: 14px; font-weight: 600; fill: #5f5a4e; }
  </style>
</defs>

<rect width="1200" height="800" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="764" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="740" fill="none" stroke="#111111" stroke-width="1"/>

<text x="58" y="60" class="eyebrow" fill="#ad0034">RFP / EVIDENCE SYSTEM</text>
<text x="58" y="102" class="title" fill="#111111">An RFP makes the risk boundary explicit</text>
<text x="58" y="132" class="subtitle">Responsibility moves only when an operating need becomes a testable, enforceable obligation.</text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>

<text x="70" y="193" class="eyebrow" fill="#111111">BUYER RETAINS</text>
<text x="455" y="193" class="eyebrow" fill="#ad0034">THE RFP CONVERTS</text>
<text x="845" y="193" class="eyebrow" fill="#007f7b">VENDOR OWNS</text>

<rect x="60" y="218" width="300" height="92" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<text x="78" y="248" class="box-title" fill="#111111">NEED + PRIORITY</text>
<text x="78" y="276" class="copy">Why the capability matters</text>
<text x="78" y="297" class="copy">and what the organization funds</text>

<rect x="60" y="330" width="300" height="92" fill="#fffdf5" stroke="#dcc61e" stroke-width="3"/>
<text x="78" y="360" class="box-title" fill="#111111">OPERATING CONDITIONS</text>
<text x="78" y="388" class="copy">Workload, site, integrations,</text>
<text x="78" y="409" class="copy">staffing, and data classification</text>

<rect x="60" y="442" width="300" height="92" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<text x="78" y="472" class="box-title" fill="#111111">INTERNAL CHANGE</text>
<text x="78" y="500" class="copy">Readiness, ownership, adoption,</text>
<text x="78" y="521" class="copy">and retirement of the old system</text>

<rect x="435" y="218" width="330" height="316" fill="#fff8e0" stroke="#ad0034" stroke-width="4"/>
<rect x="459" y="242" width="282" height="268" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="600" y="278" class="box-title" fill="#111111" text-anchor="middle">OPERATING NEED</text>
<line x1="493" y1="296" x2="707" y2="296" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-red)"/>
<text x="600" y="326" class="copy" text-anchor="middle">Requirement + assumption</text>
<line x1="493" y1="347" x2="707" y2="347" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-red)"/>
<text x="600" y="377" class="copy" text-anchor="middle">Acceptance test + evidence</text>
<line x1="493" y1="398" x2="707" y2="398" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-red)"/>
<text x="600" y="428" class="copy" text-anchor="middle">Contract duty + remedy</text>
<rect x="487" y="454" width="226" height="34" fill="#dcc61e" stroke="#111111" stroke-width="2"/>
<text x="600" y="477" font-size="13" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing=".7">RECORDED ALLOCATION</text>

<rect x="840" y="218" width="300" height="92" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="858" y="248" class="box-title" fill="#111111">DESIGN CLAIMS</text>
<text x="858" y="276" class="copy">The proposed system can meet</text>
<text x="858" y="297" class="copy">the stated requirements</text>

<rect x="840" y="330" width="300" height="92" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="858" y="360" class="box-title" fill="#111111">DELIVERY QUALITY</text>
<text x="858" y="388" class="copy">Installation, configuration,</text>
<text x="858" y="409" class="copy">integration, and documentation</text>

<rect x="840" y="442" width="300" height="92" fill="#fffdf5" stroke="#2f7d32" stroke-width="3"/>
<text x="858" y="472" class="box-title" fill="#111111">PROVEN OUTCOMES</text>
<text x="858" y="500" class="copy">Performance, failure behavior,</text>
<text x="858" y="521" class="copy">support response, and remediation</text>

<line x1="360" y1="264" x2="435" y2="264" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="360" y1="376" x2="435" y2="376" stroke="#dcc61e" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="360" y1="488" x2="435" y2="488" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<line x1="765" y1="264" x2="840" y2="264" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-teal)"/>
<line x1="765" y1="376" x2="840" y2="376" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-teal)"/>
<line x1="765" y1="488" x2="840" y2="488" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow-teal)"/>

<rect x="150" y="586" width="900" height="88" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<text x="600" y="618" font-size="18" font-weight="800" fill="#ad0034" text-anchor="middle">UNDEFINED EXPECTATION = BUYER RISK</text>
<text x="600" y="648" class="copy" text-anchor="middle">If an outcome never becomes a requirement, test, or obligation, “we delivered what you asked for” wins.</text>
<path d="M600,586 L600,552 L210,552 L210,534" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>

<line x1="58" y1="724" x2="1142" y2="724" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="752" class="small">Clarity is reciprocal: the buyer defines reality; the vendor stands behind the claims it agrees to prove.</text>
</svg>
