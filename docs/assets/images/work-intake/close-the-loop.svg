<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Work Intake closes the same delivery loop</title>
<desc id="desc">Authorize, deliver, measure, compare, and adapt are the same lifecycle used by SDLC, DevOps, and process improvement.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fffdf5"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="2" opacity=".22"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f5efdc"/>
    <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-width="1" opacity=".08"/>
  </pattern>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
    .tiny { font-size: 12px; fill: #5f5a4e; letter-spacing: .5px; }
  </style>
</defs>

<rect width="1200" height="760" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="724" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="700" fill="none" stroke="none"/>
<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">WORK INTAKE / SYSTEM FIGURE</tspan></text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Work Intake closes the same delivery loop</tspan></text>
<text x="58" y="132" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Authorize, deliver, measure, compare, and adapt are the same lifecycle used by SDLC, DevOps, and process improvement.</tspan></text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>
<rect x="55" y="250" width="190" height="125" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="55" y="250" width="42" height="35" rx="0" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="76" y="274" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="76" dy="0">1</tspan></text>
<text x="109" y="278" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="109" dy="0">AUTHORIZE</tspan></text>
<text x="71" y="305" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="71" dy="0">Record the</tspan><tspan x="71" dy="20">prediction</tspan></text>
<line x1="245" y1="312" x2="280" y2="312" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="280" y="250" width="190" height="125" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<rect x="280" y="250" width="42" height="35" rx="0" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="301" y="274" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="301" dy="0">2</tspan></text>
<text x="334" y="278" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="334" dy="0">DELIVER</tspan></text>
<text x="296" y="305" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="296" dy="0">Execute inside</tspan><tspan x="296" dy="20">the boundaries</tspan></text>
<line x1="470" y1="312" x2="505" y2="312" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="505" y="250" width="190" height="125" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="505" y="250" width="42" height="35" rx="0" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="526" y="274" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="526" dy="0">3</tspan></text>
<text x="559" y="278" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="559" dy="0">MEASURE</tspan></text>
<text x="521" y="305" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="521" dy="0">Ending state</tspan><tspan x="521" dy="20">Intake history</tspan></text>
<line x1="695" y1="312" x2="730" y2="312" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="730" y="250" width="190" height="125" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="730" y="250" width="42" height="35" rx="0" fill="#007f7b" stroke="#007f7b" stroke-width="2"/>
<text x="751" y="274" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="751" dy="0">4</tspan></text>
<text x="784" y="278" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="784" dy="0">COMPARE</tspan></text>
<text x="746" y="305" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="746" dy="0">Outcome vs. proposal</tspan><tspan x="746" dy="20">Flow vs. expectation</tspan></text>
<line x1="920" y1="312" x2="955" y2="312" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="955" y="250" width="190" height="125" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="955" y="250" width="42" height="35" rx="0" fill="#ad0034" stroke="#ad0034" stroke-width="2"/>
<text x="976" y="274" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle" letter-spacing="0"><tspan x="976" dy="0">5</tspan></text>
<text x="1009" y="278" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="1009" dy="0">ADAPT</tspan></text>
<text x="971" y="305" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="971" dy="0">Operating action</tspan><tspan x="971" dy="20">Process refinement</tspan></text>
<rect x="585" y="440" width="235" height="100" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="601" y="468" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="601" dy="0">OUTCOME</tspan></text>
<text x="601" y="495" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="601" dy="0">Did the work do</tspan><tspan x="601" dy="20">what we approved?</tspan></text>
<rect x="840" y="440" width="250" height="100" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<text x="856" y="468" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="856" dy="0">PROCESS</tspan></text>
<text x="856" y="495" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="856" dy="0">Where did intake create</tspan><tspan x="856" dy="20">rework or delay?</tspan></text>
<path d="M565,375 L565,410 L702,410 L702,440" fill="none" stroke="#007f7b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-cyan)"/>
<path d="M635,375 L635,425 L965,425 L965,440" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<path d="M1050,375 L1120,375 L1120,600 L150,600 L150,375" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>
<rect x="487" y="580" width="225" height="34" rx="17" fill="#fff8e0" stroke="#111111" stroke-width="2"/>
<text x="599.5" y="603" font-size="13" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0.4"><tspan x="599.5" dy="0">NEXT ITERATION</tspan></text>
<text x="150" y="625" font-size="15" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="150" dy="0">The next authorization receives the evidence; the original prediction remains unchanged.</tspan></text>
<line x1="58" y1="694" x2="1142" y2="694" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="722" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The loop is ordinary: plan, deliver, measure, learn, and use the learning in the next decision.</tspan></text>
</svg>
