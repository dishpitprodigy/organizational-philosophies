<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">A reservation turns an established priority into usable capacity</title>
<desc id="desc">The dependency team leaves one slot open so higher-priority work can enter mid-period without pretending every late arrival outranks the queue.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#007f7b"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#fffdf5"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="2" opacity=".22"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f5efdc"/>
    <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-width="1" opacity=".08"/>
  </pattern>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 20px; font-weight: 800; }
    .box-copy { font-size: 16px; fill: #3f3b34; }
    .small { font-size: 14px; fill: #5f5a4e; }
    .tiny { font-size: 12px; fill: #5f5a4e; letter-spacing: .5px; }
  </style>
</defs>

<rect width="1200" height="800" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="764" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="740" fill="none" stroke="none"/>
<text x="58" y="60" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.8"><tspan x="58" dy="0">WORK INTAKE / SYSTEM FIGURE</tspan></text>
<text x="58" y="102" font-size="34" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">A reservation turns an established priority into usable capacity</tspan></text>
<text x="58" y="132" font-size="17" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">The dependency team leaves one slot open so higher-priority work can enter mid-period without pretending every late arrival outranks the queue.</tspan></text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>
<text x="60" y="195" font-size="16" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.2"><tspan x="60" dy="0">AT INTERVAL PLANNING</tspan></text>
<text x="650" y="195" font-size="16" font-weight="800" fill="#007f7b" text-anchor="start" letter-spacing="1.2"><tspan x="650" dy="0">WHEN THE DEPENDENCY ARRIVES</tspan></text>
<text x="60" y="238" font-size="13" font-weight="800" fill="#5f5a4e" text-anchor="start" letter-spacing="1"><tspan x="60" dy="0">TEAM CAPACITY</tspan></text>
<rect x="60" y="255" width="490" height="220" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<line x1="60" y1="365" x2="550" y2="365" stroke="#ddd5bf" stroke-width="2"/>
<text x="650" y="238" font-size="13" font-weight="800" fill="#5f5a4e" text-anchor="start" letter-spacing="1"><tspan x="650" dy="0">TEAM CAPACITY</tspan></text>
<rect x="650" y="255" width="490" height="220" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<line x1="650" y1="365" x2="1140" y2="365" stroke="#ddd5bf" stroke-width="2"/>
<rect x="75" y="275" width="145" height="70" rx="0" fill="#ddd5bf" stroke="#111111" stroke-width="2"/>
<text x="147" y="316" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="147" dy="0">WORK A</tspan></text>
<rect x="235" y="275" width="145" height="70" rx="0" fill="#ddd5bf" stroke="#111111" stroke-width="2"/>
<text x="307" y="316" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="307" dy="0">WORK B</tspan></text>
<rect x="395" y="275" width="140" height="70" rx="0" fill="#ddd5bf" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 6"/>
<text x="465" y="307" font-size="16" font-weight="800" fill="#ad0034" text-anchor="middle" letter-spacing="0"><tspan x="465" dy="0">RESERVED</tspan></text>
<text x="465" y="328" font-size="14" font-weight="800" fill="#ad0034" text-anchor="middle" letter-spacing="0"><tspan x="465" dy="0">SLOT</tspan></text>
<rect x="75" y="385" width="145" height="70" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="147" y="426" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="147" dy="0">WORK C</tspan></text>
<text x="245" y="413" font-size="13" font-weight="800" fill="#5f5a4e" text-anchor="start" letter-spacing="1"><tspan x="245" dy="0">QUEUED</tspan></text>
<path d="M220,420 L375,420" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-ink)"/>
<rect x="665" y="275" width="145" height="70" rx="0" fill="#ddd5bf" stroke="#111111" stroke-width="2"/>
<text x="737" y="316" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="737" dy="0">WORK A</tspan></text>
<rect x="825" y="275" width="145" height="70" rx="0" fill="#ddd5bf" stroke="#111111" stroke-width="2"/>
<text x="897" y="316" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="897" dy="0">WORK B</tspan></text>
<rect x="985" y="275" width="140" height="70" rx="0" fill="#fff8e0" stroke="#007f7b" stroke-width="4"/>
<text x="1055" y="307" font-size="15" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="1055" dy="0">OS MIGRATION</tspan></text>
<text x="1055" y="329" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0"><tspan x="1055" dy="0">STARTS NOW</tspan></text>
<rect x="665" y="385" width="145" height="70" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<text x="737" y="426" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="737" dy="0">WORK C</tspan></text>
<text x="840" y="413" font-size="13" font-weight="800" fill="#5f5a4e" text-anchor="start" letter-spacing="1"><tspan x="840" dy="0">STILL QUEUED</tspan></text>
<path d="M465,255 L465,225 L1055,225 L1055,275" fill="none" stroke="#007f7b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-cyan)"/>
<rect x="690" y="208" width="230" height="34" rx="17" fill="#fff8e0" stroke="#007f7b" stroke-width="2"/>
<text x="805.0" y="231" font-size="13" font-weight="800" fill="#007f7b" text-anchor="middle" letter-spacing="0.4"><tspan x="805.0" dy="0">NEW IMAGE AVAILABLE</tspan></text>
<text x="60" y="525" font-size="15" font-weight="800" fill="#ad0034" text-anchor="start" letter-spacing="1.1"><tspan x="60" dy="0">WHY IT JUMPS THE QUEUE</tspan></text>
<rect x="60" y="545" width="330" height="90" rx="0" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<text x="76" y="573" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">PRIORITY ALREADY DECIDED</tspan></text>
<text x="76" y="600" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="76" dy="0">The expiring contract creates</tspan><tspan x="76" dy="20">the organizational consequence.</tspan></text>
<rect x="435" y="545" width="330" height="90" rx="0" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<text x="451" y="573" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="451" dy="0">CAPACITY HELD OPEN</tspan></text>
<text x="451" y="600" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="451" dy="0">The team did not commit</tspan><tspan x="451" dy="20">the reserved slot elsewhere.</tspan></text>
<rect x="810" y="545" width="330" height="90" rx="0" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<text x="826" y="573" font-size="19" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0"><tspan x="826" dy="0">NO PRIORITY INVENTED</tspan></text>
<text x="826" y="600" font-size="15" font-weight="400" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="826" dy="0">The reservation implements</tspan><tspan x="826" dy="20">the decision; it does not make it.</tspan></text>
<line x1="58" y1="734" x2="1142" y2="734" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="762" font-size="14" font-weight="600" fill="#5f5a4e" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">If nothing activates or renews the reservation by its cutoff, the team releases the slot.</tspan></text>
</svg>
