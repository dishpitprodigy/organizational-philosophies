<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Payment follows proof of capability</title>
<desc id="desc">Delivery and installation begin a gated path through integration, performance, failure behavior, operational handoff, and burn-in. A failed gate returns to vendor-funded remediation. Final acceptance releases final payment only after the full capability is proven.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#ad0034"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2f7d32"/>
  </marker>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 17px; fill: #5f5a4e; }
    .box-title { font-size: 17px; font-weight: 800; }
    .copy { font-size: 14px; fill: #5f5a4e; }
    .small { font-size: 14px; font-weight: 600; fill: #5f5a4e; }
  </style>
</defs>

<rect width="1200" height="820" fill="#f5efdc"/>
<rect x="18" y="18" width="1164" height="784" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="30" y="30" width="1140" height="760" fill="none" stroke="#111111" stroke-width="1"/>

<text x="58" y="60" class="eyebrow" fill="#ad0034">RFP / EVIDENCE SYSTEM</text>
<text x="58" y="102" class="title" fill="#111111">Payment follows proof of capability</text>
<text x="58" y="132" class="subtitle">Shipment starts the acceptance path; it does not finish the purchase.</text>
<line x1="58" y1="151" x2="1142" y2="151" stroke="#111111" stroke-width="2"/>

<rect x="52" y="245" width="190" height="130" fill="#fffdf5" stroke="#111111" stroke-width="3"/>
<rect x="52" y="245" width="42" height="35" fill="#111111"/>
<text x="73" y="269" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">1</text>
<text x="106" y="273" class="box-title" fill="#111111">DELIVERY</text>
<text x="70" y="305" class="copy">Items received</text>
<text x="70" y="327" class="copy">Installed + configured</text>
<text x="70" y="349" class="copy">Baseline documented</text>

<line x1="242" y1="310" x2="272" y2="310" stroke="#111111" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="272" y="245" width="190" height="130" fill="#fffdf5" stroke="#007f7b" stroke-width="3"/>
<rect x="272" y="245" width="42" height="35" fill="#007f7b"/>
<text x="293" y="269" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">2</text>
<text x="326" y="273" class="box-title" fill="#111111">FUNCTION</text>
<text x="290" y="305" class="copy">Required features</text>
<text x="290" y="327" class="copy">Identity + monitoring</text>
<text x="290" y="349" class="copy">Network + backup paths</text>

<line x1="462" y1="310" x2="492" y2="310" stroke="#007f7b" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="492" y="245" width="190" height="130" fill="#fffdf5" stroke="#ad0034" stroke-width="3"/>
<rect x="492" y="245" width="42" height="35" fill="#ad0034"/>
<text x="513" y="269" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">3</text>
<text x="546" y="273" class="box-title" fill="#111111">STRESS</text>
<text x="510" y="305" class="copy">Performance thresholds</text>
<text x="510" y="327" class="copy">Failure-mode behavior</text>
<text x="510" y="349" class="copy">Recovery + replacement</text>

<line x1="682" y1="310" x2="712" y2="310" stroke="#ad0034" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="712" y="245" width="190" height="130" fill="#fffdf5" stroke="#dcc61e" stroke-width="3"/>
<rect x="712" y="245" width="42" height="35" fill="#dcc61e"/>
<text x="733" y="269" font-size="16" font-weight="800" fill="#111111" text-anchor="middle">4</text>
<text x="766" y="273" class="box-title" fill="#111111">HANDOFF</text>
<text x="730" y="305" class="copy">Runbooks + training</text>
<text x="730" y="327" class="copy">Alerts + support path</text>
<text x="730" y="349" class="copy">Operational ownership</text>

<line x1="902" y1="310" x2="932" y2="310" stroke="#dcc61e" stroke-width="3" marker-end="url(#arrow-ink)"/>

<rect x="932" y="245" width="215" height="130" fill="#fffdf5" stroke="#007f7b" stroke-width="4"/>
<rect x="932" y="245" width="42" height="35" fill="#007f7b"/>
<text x="953" y="269" font-size="16" font-weight="800" fill="#fffdf5" text-anchor="middle">5</text>
<text x="986" y="273" class="box-title" fill="#111111">BURN-IN</text>
<text x="950" y="305" class="copy">Sustained representative load</text>
<text x="950" y="327" class="copy">Defect + uptime thresholds</text>
<text x="950" y="349" class="copy">Clock-reset rules applied</text>

<line x1="1040" y1="375" x2="1040" y2="430" stroke="#2f7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="880" y="430" width="267" height="118" fill="#eaf4e6" stroke="#2f7d32" stroke-width="4"/>
<text x="1014" y="463" font-size="19" font-weight="800" fill="#111111" text-anchor="middle">FINAL ACCEPTANCE</text>
<text x="1014" y="491" class="copy" text-anchor="middle">Capability proven</text>
<rect x="927" y="507" width="174" height="28" fill="#2f7d32"/>
<text x="1014" y="526" font-size="12" font-weight="800" fill="#fffdf5" text-anchor="middle">FINAL PAYMENT RELEASED</text>

<rect x="350" y="468" width="335" height="110" fill="#fff8e0" stroke="#ad0034" stroke-width="3"/>
<text x="518" y="500" font-size="19" font-weight="800" fill="#ad0034" text-anchor="middle">FAILED GATE</text>
<text x="518" y="529" class="copy" text-anchor="middle">Cure, repair, replace, retest</text>
<text x="518" y="552" class="copy" text-anchor="middle">Acceptance and leverage remain open</text>

<path d="M147,375 L147,523 L350,523" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<path d="M367,375 L367,450 L430,450 L430,468" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<path d="M587,375 L587,468" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<path d="M807,375 L807,450 L610,450 L610,468" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<path d="M1147,350 L1158,350 L1158,615 L177,615 L177,375" fill="none" stroke="#ad0034" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<text x="448" y="638" font-size="13" font-weight="800" fill="#ad0034" text-anchor="middle">REMEDIATION RETURNS TO THE AFFECTED GATE; MATERIAL FAILURE MAY RESTART BURN-IN</text>

<rect x="52" y="664" width="1095" height="42" fill="#fffdf5" stroke="#111111" stroke-width="2"/>
<line x1="76" y1="685" x2="860" y2="685" stroke="#ad0034" stroke-width="5"/>
<text x="870" y="691" font-size="14" font-weight="800" fill="#ad0034">PAYMENT LEVERAGE HELD</text>
<rect x="1058" y="676" width="65" height="18" fill="#2f7d32"/>

<line x1="58" y1="746" x2="1142" y2="746" stroke="#ddd5bf" stroke-width="2"/>
<text x="58" y="774" class="small">Milestones may release partial payment; enough leverage remains until the promised operating capability is proven.</text>
</svg>
