services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: work_intake
      POSTGRES_USER: work_intake
      POSTGRES_PASSWORD: work_intake
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U work_intake -d work_intake']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - work-intake-postgres-18:/var/lib/postgresql

volumes:
  work-intake-postgres-18:
