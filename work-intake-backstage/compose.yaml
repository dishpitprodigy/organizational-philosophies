services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: backstage
      POSTGRES_USER: work_intake
      POSTGRES_PASSWORD: work_intake
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U work_intake -d backstage']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - work-intake-postgres:/var/lib/postgresql/data

volumes:
  work-intake-postgres:
