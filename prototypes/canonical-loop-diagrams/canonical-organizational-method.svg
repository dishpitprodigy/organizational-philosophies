<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title description">
<title id="title">Canonical Organizational Method</title>
<desc id="description">A closed-loop organizational method beginning with observation, question, research, and hypothesis. Business expands the scientific experiment into adaptive implementation, then produces results that must be examined, reconciled, communicated, and used to change the system or next decision.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24364b"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#122033" flood-opacity="0.14"/></filter>
</defs>
<rect width="1600" height="2200" fill="#f7f8fa"/>
<text x="800.0" y="64.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="42" font-weight="750" fill="#122033"><tspan x="800.0" dy="0">Canonical Organizational Method</tspan></text>
<text x="800.0" y="102.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="450" fill="#506176"><tspan x="800.0" dy="0">The scientific method with an outcome-directed, adaptive business implementation</tspan><tspan x="800.0" dy="28">phase</tspan></text>
<rect x="450" y="165" width="700" height="104" rx="20" fill="#dce7f2" stroke="#315c82" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="217.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#315c82"><tspan x="512.0" dy="0">1</tspan></text>
<text x="828.0" y="217.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Notice a condition</tspan></text>
<rect x="450" y="320" width="700" height="104" rx="20" fill="#d9e9fb" stroke="#2f6ea6" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="372.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#2f6ea6"><tspan x="512.0" dy="0">2</tspan></text>
<text x="828.0" y="372.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Ask a question</tspan></text>
<rect x="450" y="475" width="700" height="104" rx="20" fill="#dcefe8" stroke="#32755e" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="527.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#32755e"><tspan x="512.0" dy="0">3</tspan></text>
<text x="828.0" y="510.5" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Investigate the current and external</tspan><tspan x="828.0" dy="33">state</tspan></text>
<rect x="450" y="630" width="700" height="104" rx="20" fill="#fff0c9" stroke="#9a6a00" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="682.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#9a6a00"><tspan x="512.0" dy="0">4</tspan></text>
<text x="828.0" y="682.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Form a hypothesis</tspan></text>
<line x1="800.0" y1="277" x2="800.0" y2="313" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<line x1="800.0" y1="432" x2="800.0" y2="468" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<line x1="800.0" y1="587" x2="800.0" y2="623" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="1200" y="155" width="315" height="150" rx="18" fill="#ffffff" stroke="#315c82" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1357.5" y="191.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#122033"><tspan x="1357.5" dy="0">May remain background</tspan><tspan x="1357.5" dy="26">context.</tspan><tspan x="1357.5" dy="26">No question or action</tspan><tspan x="1357.5" dy="26">required.</tspan></text>
<line x1="1150" y1="217" x2="1200" y2="217" stroke="#315c82" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 8"/>
<rect x="115" y="785" width="1370" height="590" rx="28" fill="#f4faF1" stroke="#477b37" stroke-width="4" filter="url(#shadow)"/>
<text x="190.0" y="840.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="28" font-weight="750" fill="#477b37"><tspan x="190.0" dy="0">5</tspan></text>
<text x="800.0" y="837.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="34" font-weight="750" fill="#122033"><tspan x="800.0" dy="0">Adaptive Business Implementation</tspan></text>
<text x="800.0" y="871.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="20" font-weight="450" fill="#506176"><tspan x="800.0" dy="0">Science runs a controlled experiment here. Business funds an intervention intended to make a</tspan><tspan x="800.0" dy="24">desired condition true.</tspan></text>
<line x1="800.0" y1="734" x2="800.0" y2="785" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="170" y="930" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="347.5" y="976.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="347.5" dy="0">Define desired outcome</tspan><tspan x="347.5" dy="26">and guardrails</tspan></text>
<rect x="620" y="930" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="797.5" y="976.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="797.5" dy="0">Authorize capacity</tspan><tspan x="797.5" dy="26">and risk</tspan></text>
<rect x="1070" y="930" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="1247.5" y="976.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="1247.5" dy="0">Decompose the</tspan><tspan x="1247.5" dy="26">intervention</tspan></text>
<rect x="170" y="1145" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="347.5" y="1191.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="347.5" dy="0">Implement a</tspan><tspan x="347.5" dy="26">bounded increment</tspan></text>
<rect x="620" y="1145" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="797.5" y="1191.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="797.5" dy="0">Inspect and test</tspan><tspan x="797.5" dy="26">the increment</tspan></text>
<rect x="1070" y="1145" width="355" height="118" rx="18" fill="#dff2d9" stroke="#477b37" stroke-width="3"/>
<text x="1247.5" y="1191.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#122033"><tspan x="1247.5" dy="0">Update approach</tspan><tspan x="1247.5" dy="26">and forecast</tspan></text>
<line x1="525" y1="989" x2="620" y2="989" stroke="#24364b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<line x1="975" y1="989" x2="1070" y2="989" stroke="#24364b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1247 1048 L 1247 1095 L 347 1095 L 347 1145" stroke="#24364b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<line x1="525" y1="1204" x2="620" y2="1204" stroke="#24364b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<line x1="975" y1="1204" x2="1070" y2="1204" stroke="#24364b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1247 1263 L 1247 1322 L 347 1322 L 347 1263" stroke="#477b37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/>
<text x="800.0" y="1345.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#477b37"><tspan x="800.0" dy="0">Repeat while evidence supports another increment</tspan></text>
<rect x="450" y="1460" width="700" height="104" rx="20" fill="#ffe2d8" stroke="#a64f33" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="1512.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#a64f33"><tspan x="512.0" dy="0">6</tspan></text>
<text x="828.0" y="1512.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Produce results</tspan></text>
<rect x="450" y="1615" width="700" height="104" rx="20" fill="#e7def7" stroke="#6a4e9f" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="1667.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#6a4e9f"><tspan x="512.0" dy="0">7</tspan></text>
<text x="828.0" y="1667.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Examine, analyze, and reconcile results</tspan></text>
<rect x="450" y="1770" width="700" height="104" rx="20" fill="#d8eff0" stroke="#34767a" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="1822.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#34767a"><tspan x="512.0" dy="0">8</tspan></text>
<text x="828.0" y="1822.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Communicate and route results</tspan></text>
<rect x="450" y="1925" width="700" height="104" rx="20" fill="#dbe1f5" stroke="#455b9b" stroke-width="3" filter="url(#shadow)"/>
<text x="512.0" y="1977.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="750" fill="#455b9b"><tspan x="512.0" dy="0">9</tspan></text>
<text x="828.0" y="1961.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#122033"><tspan x="828.0" dy="0">Change knowledge, the system, or the next</tspan><tspan x="828.0" dy="32">decision</tspan></text>
<path d="M 1247 1263 L 1247 1410 L 800 1410 L 800 1460" stroke="#24364b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1325.0" y="1391.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#506176"><tspan x="1325.0" dy="0">Complete, stop,</tspan><tspan x="1325.0" dy="22">or disprove</tspan></text>
<line x1="800.0" y1="1572" x2="800.0" y2="1608" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<line x1="800.0" y1="1727" x2="800.0" y2="1763" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<line x1="800.0" y1="1882" x2="800.0" y2="1918" stroke="#24364b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 450 1977 C 210 1977 145 1860 145 1650 L 145 360 C 145 230 245 217 450 217" stroke="#455b9b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="250.0" y="2057.5" text-anchor="start" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#455b9b"><tspan x="250.0" dy="0">The changed context produces future observations</tspan><tspan x="250.0" dy="25">and questions.</tspan></text>
<text x="800.0" y="2137.0" text-anchor="middle" font-family="Inter, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#122033"><tspan x="800.0" dy="0">Observation may stop without action. Results produced by an intentional intervention must be</tspan><tspan x="800.0" dy="26">examined.</tspan></text>
</svg>
