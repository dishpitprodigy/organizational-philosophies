---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: data-center-assets
  title: Data Center Assets
  description: Racks, power, cabling, installed compute hardware, and remote-hands inventory.
  annotations:
    northstar.example/jira-project-key: DC
spec:
  type: physical-infrastructure
  lifecycle: production
  owner: dcops
  system: data-center-foundation
  dependsOn:
    - resource:default/network-fabric
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: network-fabric
  title: Network Fabric
  description: Routed data-center and cloud connectivity used by Northstar production systems.
  annotations:
    northstar.example/jira-project-key: NETENG
spec:
  type: network
  lifecycle: production
  owner: neteng
  system: network-fabric
  dependsOn:
    - resource:default/data-center-assets
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: identity-directories
  title: Identity Directories
  description: Corporate AD, Research AD, FreeIPA, and cloud-IAM identity stores.
  annotations:
    northstar.example/jira-project-key: IDENTITY
    northstar.example/current-state-ref: ID-ARCH-001-rev-3
spec:
  type: identity-store
  lifecycle: production
  owner: identity
  system: identity-platform
  dependsOn:
    - component:default/linux-fleet-management
    - resource:default/network-fabric
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: research-data-storage
  title: Research Data Storage
  description: Object, file, and database storage carrying governed research-data retention.
  annotations:
    northstar.example/jira-project-key: DATA
spec:
  type: storage
  lifecycle: production
  owner: dataeng
  system: research-data-platform
  dependsOn:
    - component:default/linux-fleet-management
    - resource:default/network-fabric
    - component:default/identity-broker
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: metrics-retention-storage
  title: Metrics Retention Storage
  description: Storage serving the 31-day, 93-day, and 730-day metrics retention outcomes.
  annotations:
    northstar.example/jira-project-key: SRE
    northstar.example/current-state-ref: OBS-ARCH-004-rev-7
spec:
  type: time-series-storage
  lifecycle: production
  owner: sre
  system: metrics-alerting-platform
  dependsOn:
    - component:default/container-runtime
    - resource:default/network-fabric
    - component:default/identity-broker
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: researcher-portal-web
  title: Researcher Portal Web Application
  description: Browser application for projects, datasets, and compute workflows.
  annotations:
    northstar.example/jira-project-key: APPS
spec:
  type: website
  lifecycle: production
  owner: appeng
  system: researcher-portal
  providesApis: [research-project-api]
  consumesApis:
    - compute-scheduling-api
    - workforce-identity-api
    - research-data-api
    - metrics-query-api
  dependsOn:
    - component:default/edge-gateway
    - component:default/identity-broker
    - component:default/container-runtime
    - component:default/research-data-service
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: compute-scheduler-service
  title: Compute Scheduler Service
  description: Schedules research workloads across data-center and cloud compute pools.
  annotations:
    northstar.example/jira-project-key: PLATFORM
spec:
  type: service
  lifecycle: production
  owner: platform
  system: compute-scheduler
  providesApis: [compute-scheduling-api]
  consumesApis:
    - workforce-identity-api
    - research-data-api
    - metrics-ingest-api
  dependsOn:
    - component:default/linux-fleet-management
    - resource:default/network-fabric
    - component:default/identity-broker
    - component:default/research-data-service
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: secure-data-transfer-service
  title: Secure Data Transfer Service
  description: Transfers large datasets across institutional trust boundaries.
  annotations:
    northstar.example/jira-project-key: DATA
spec:
  type: service
  lifecycle: production
  owner: dataeng
  system: secure-data-transfer
  providesApis: [secure-data-transfer-api]
  consumesApis:
    - workforce-identity-api
    - research-data-api
    - metrics-ingest-api
  dependsOn:
    - component:default/edge-gateway
    - component:default/identity-broker
    - component:default/research-data-service
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: edge-gateway
  title: Edge Gateway
  description: Implements public DNS, DDoS controls, load balancing, and ingress routing.
  annotations:
    northstar.example/jira-project-key: NETENG
spec:
  type: service
  lifecycle: production
  owner: neteng
  system: edge-services
  dependsOn:
