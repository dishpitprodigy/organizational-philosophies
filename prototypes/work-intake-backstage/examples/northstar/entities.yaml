    - resource:default/network-fabric
    - component:default/identity-broker
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: linux-fleet-management
  title: Linux Fleet Management
  description: RHEL images, lifecycle controls, virtualization, bare-metal provisioning, and configuration management.
  annotations:
    northstar.example/jira-project-key: SYSENG
spec:
  type: service
  lifecycle: production
  owner: syseng
  system: linux-fleet
  consumesApis:
    - workforce-identity-api
    - metrics-ingest-api
  dependsOn:
    - resource:default/data-center-assets
    - resource:default/network-fabric
    - component:default/identity-broker
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: identity-broker
  title: Identity Broker
  description: Provides human, service, and workload authentication and authorization interfaces.
  annotations:
    northstar.example/jira-project-key: IDENTITY
    northstar.example/current-state-ref: ID-ARCH-001-rev-3
spec:
  type: service
  lifecycle: production
  owner: identity
  system: identity-platform
  providesApis: [workforce-identity-api]
  consumesApis: [metrics-ingest-api]
  dependsOn:
    - resource:default/identity-directories
    - resource:default/network-fabric
    - component:default/linux-fleet-management
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: research-data-service
  title: Research Data Service
  description: Presents governed object, file, and database services to research workloads.
  annotations:
    northstar.example/jira-project-key: DATA
spec:
  type: service
  lifecycle: production
  owner: dataeng
  system: research-data-platform
  providesApis: [research-data-api]
  consumesApis:
    - workforce-identity-api
    - metrics-ingest-api
  dependsOn:
