  title: Container Runtime
  description: Shared Kubernetes clusters and application-delivery substrate.
  annotations:
    northstar.example/jira-project-key: PLATFORM
spec:
  type: service
  lifecycle: production
  owner: platform
  system: container-platform
  consumesApis:
