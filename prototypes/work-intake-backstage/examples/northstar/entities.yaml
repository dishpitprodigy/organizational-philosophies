    - component:default/linux-fleet-management
    - resource:default/network-fabric
    - component:default/identity-broker
    - component:default/metrics-service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: metrics-service
  title: Metrics and Alerting Service
  description: Receives Prometheus-format metrics and provides alert evaluation, dashboards, and SLO evidence.
  annotations:
    northstar.example/jira-project-key: SRE
    northstar.example/current-state-ref: OBS-ARCH-004-rev-7
spec:
  type: service
  lifecycle: production
  owner: sre
  system: metrics-alerting-platform
  providesApis: [metrics-ingest-api, metrics-query-api]
  consumesApis: [workforce-identity-api]
  dependsOn:
    - resource:default/metrics-retention-storage
    - component:default/container-runtime
    - resource:default/network-fabric
    - component:default/identity-broker
